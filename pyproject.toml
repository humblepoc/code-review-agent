[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mr-review-agent"
version = "0.1.0"
description = "GitLab merge-request review agent on the Lambda-first agent framework."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# boto3 is only needed if your agent's tools call AWS.
aws = [
    "boto3>=1.35",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agent.agents" = ["**/*.md"]
