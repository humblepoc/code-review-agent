# CI for the MR review agent.
#
# This repo hosts the agent AND self-tests it: the `code_review` job below runs
# the agent against this very repo's merge requests / branches, mimicking what
# other projects will do. Because the agent code lives here, the job just runs
# `ci_entry.py` directly (no clone needed).
#
# Other repos consume the agent via the `code_review_external` template at the
# bottom (kept commented as a copy-paste reference).
#
# WHY CI (not Lambda yet): the GitLab instance is internal-only. The runner
# already reaches GitLab and can reach the public Siemens AI gateway outbound,
# so no VPC is required. (The Lambda entry point stays in the repo for a later
# VPC-based webhook deployment.)
#
# REQUIRED CI/CD VARIABLES (Settings -> CI/CD -> Variables, masked):
#   AGENT_SIEMENS_API_KEY  = SIAK-...            Siemens AI gateway key
#   GITLAB_TOKEN           = <token with 'api'>  read diffs + post notes
#
# BEHAVIOR (auto-detected by ci_entry.py):
#   - Merge-request pipeline  -> reviews the MR and POSTS comments.
#   - Feature-branch pipeline -> if an open MR (branch -> default) exists, posts
#                                to it; otherwise PRINTS the review in this log.

stages:
  - review

# Common config shared by the self-test job and the external template.
.code_review_base:
  stage: review
  image: ${HARBOR_REGISTRY}/container-hardening-service/python:3.11.16-dtx26.09.01-trixie
  variables:
    # Provider/model (env wins over config.yaml).
    AGENT_LLM_PROVIDER: "siemens-ai"
    AGENT_LLM_MODEL: "qwen-3.8-27b"
    # Internal CA: disable strict TLS verify unless a CA bundle is provided via
    # GITLAB_CA_BUNDLE. Set to "true" once a bundle is available.
    GITLAB_VERIFY_SSL: "false"
    # "true" -> full technical logs (tool calls, HTTP, iterations).
    # default -> friendly, non-technical progress; errors always show.
    AGENT_VERBOSE: "false"
    # Needed for merge-request pipelines to expose CI_MERGE_REQUEST_* vars.
    GIT_STRATEGY: fetch
  rules:
    # Merge-request pipelines...
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # ...and pushes to non-default (feature) branches.
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
  allow_failure: true    # a review must never block the pipeline

# ---------------------------------------------------------------------------
# Self-test: run THIS repo's agent against THIS repo. Mimics the flow other
# projects will run. No clone — the agent code is already checked out here.
# ---------------------------------------------------------------------------
code_review:
  extends: .code_review_base
  before_script:
    - python -V
    - pip install --quiet -r requirements.txt
  script:
    - python ci_entry.py

