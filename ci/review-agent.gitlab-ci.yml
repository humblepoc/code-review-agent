# Reusable code-review template for OTHER repositories.
#
# ---------------------------------------------------------------------------
# HOW TO USE IN A CONSUMER REPO
# ---------------------------------------------------------------------------
# Add this to the consuming project's .gitlab-ci.yml:
#
#   include:
#     - project: 'your-group/code-review-agent'
#       ref: main
#       file: '/ci/review-agent.gitlab-ci.yml'
#
#   stages:
#     - review        # (or merge 'review' into your existing stages)
#
# Then set these CI/CD variables in the consumer project
# (Settings -> CI/CD -> Variables), Masked, and NOT Protected (unless your
# review branches are protected):
#
#   AGENT_CUSTOM_API_KEY   = ...            
#   GITLAB_TOKEN           = <token with 'api'>  
#
# That's it. No agent code needs to live in the consumer repo — the job below
# fetches it from the review-agent project at pipeline time.
#
# BEHAVIOR (auto-detected):
#   - Merge-request pipeline  -> reviews the MR and POSTS comments.
#   - Feature-branch pipeline -> if an open MR (branch -> default) exists, posts
#                                to it; otherwise PRINTS the review in the log.
# ---------------------------------------------------------------------------

variables:
  # Where the review-agent code lives, and which ref to use. Override in the
  # consumer repo's variables if you pin to a tag/branch.
  REVIEW_AGENT_PROJECT: "your-group/code-review-agent"
  REVIEW_AGENT_REF: "main"

code_review:
  stage: review
  image: python:3.11-slim
  variables:
    # Only pipeline mechanics + where to fetch the agent from live here.
    # Provider/model/verify_ssl/verbose come from the agent's config.yaml, and
    # may be overridden by CI/CD variables if the consumer project sets them.
    # Expose CI_MERGE_REQUEST_* vars on MR pipelines.
    GIT_STRATEGY: fetch
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
  before_script:
    - python -V
    # Fetch the agent code WITHOUT git/curl (hardened images may lack them):
    # download the repo archive via the GitLab API using Python stdlib only.
    - |
      python - <<'PY'
      import os, ssl, tarfile, urllib.request, urllib.parse, io
      host = os.environ["CI_SERVER_HOST"]
      project = os.environ["REVIEW_AGENT_PROJECT"]
      ref = os.environ.get("REVIEW_AGENT_REF", "main")
      token = os.environ["GITLAB_TOKEN"]
      pid = urllib.parse.quote(project, safe="")
      url = f"https://{host}/api/v4/projects/{pid}/repository/archive.tar.gz?sha={ref}"
      ctx = ssl.create_default_context()
      # The agent code fetch runs before config.yaml is available, so SSL
      # verification for THIS request is controlled by env only. Internal
      # instances use a private CA, so default to skipping verification here
      # unless GITLAB_VERIFY_SSL is explicitly truthy (or GITLAB_CA_BUNDLE set).
      _verify = os.environ.get("GITLAB_VERIFY_SSL", "false").lower() in ("1", "true", "yes", "on")
      _ca = os.environ.get("GITLAB_CA_BUNDLE", "")
      if _ca:
          ctx.load_verify_locations(_ca)
      elif not _verify:
          ctx.check_hostname = False; ctx.verify_mode = ssl.CERT_NONE
      req = urllib.request.Request(url, headers={"PRIVATE-TOKEN": token})
      data = urllib.request.urlopen(req, context=ctx, timeout=60).read()
      dest = "/tmp/review-agent"
      with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as t:
          members = t.getmembers()
          root = members[0].name.split("/")[0] + "/"
          for m in members:
              if m.name.startswith(root):
                  m.name = m.name[len(root):]
                  if m.name:
                      t.extract(m, dest)
      print("Fetched review-agent into", dest)
      PY
    - pip install --quiet -r /tmp/review-agent/requirements.txt
  script:
    # ci_entry.py reads the CONSUMER repo's CI_* vars (project, MR, branch) from
    # the environment, and reviews that repo — not the agent repo.
    - python /tmp/review-agent/ci_entry.py
  allow_failure: true   # a review must never block the pipeline
